version: 1

# 好みで使わないと決めた語。文章として間違いではないが、この blog では避ける。
# expected に言い換え先を書くと `mise run lint:fix` で自動置換できる。
rules:
  # 口語的すぎるので使わない
  - expected: 好ましくない
    patterns:
      - 萎える
      - 萎えた
      - 萎えました
    prh: 口語的すぎるので、評価を述べる表現に置き換える

  # 「簡単」ではなく「容易」を使う
  - expected: 容易
    patterns:
      - 簡単
    prh: 「簡単」ではなく「容易」を使う

  # 略語で書かない（「テンプレート」を「テンプレ」と略さない）
  - expected: テンプレート
    pattern: /テンプレ(?!ート)/
    prh: 略さずに書く

