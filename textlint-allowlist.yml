# textlintの検査対象から外す範囲。textlint-filter-rule-allowlist が読む。
# ファイル全体が「除外パターンの配列」である必要がある。
#
# HugoのTOML frontmatter（+++ で囲まれたブロック）を除外している。
# textlintのMarkdownパーサはYAML frontmatterしか認識しないため、
# +++ のブロックは本文として解析され、そのままでは次のような誤検出が出る。
#
#   1:1  error  Line 1 sentence length(165) exceeds the maximum sentence length of 100.
#   8:3  error  文末が"。"で終わっていません。  ja-technical-writing/ja-no-mixed-period

# +++ から次の +++ までの行（記事のfrontmatter）
- '/^\+\+\+$[\s\S]*?^\+\+\+$/m'
