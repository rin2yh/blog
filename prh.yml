version: 1

# レビューで「この用法は使わないでほしい」と判断した表現をここに集約する。
# expected に言い換え先を書くと `mise run lint:fix` で自動置換できる。
rules:
  - expected: 好ましくありませんでした
    patterns:
      - 萎えました
    prh: 口語的すぎるので、評価を述べる表現に置き換える

  - expected: 好ましくない
    patterns:
      - 萎える
    prh: 口語的すぎるので、評価を述べる表現に置き換える

  - expected: 好ましくなかった
    patterns:
      - 萎えた
    prh: 口語的すぎるので、評価を述べる表現に置き換える
