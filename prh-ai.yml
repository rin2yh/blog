version: 1

# 生成AIが書きがちで、レビューで繰り返し指摘した表現。
# 文体の好みというより「書き方として避けたい」もの。
# expected に言い換え先を書くと `mise run lint:fix` で自動置換できる。
rules:
  # 「書ける」「使える」など、可能の意味で「できる」を省略した言い方は使わない。
  # 可能形から辞書形は正規表現で復元できないため、このルールは検出のみ。
  # `mise run lint:fix` では直らないので、手で書き換える。
  - expected: 〜することができる
    pattern: /(書け|読め|使え|作れ|話せ|外せ|直せ|消せ|渡せ|置け|残せ|試せ|探せ|回せ|押せ|返せ|出せ|選べ|運べ|待て|動かせ|持てる?|保てる?)(る|ます|ない|ません|なけれ|た|れば|ず)/
    prh: 「できる」の省略表現は使わない

  # 「〜するのは」「〜書くのも」「〜ないのは」のような、名詞を省略した の＋助詞 は使わない
  - expected: $1こと$2
    pattern: /([いうくぐすずつぬぶむる])の([はもがを])/
    prh: 名詞を省略した の＋助詞 は「〜こと＋助詞」や具体的な名詞に言い換える

  # 「効く」は使わない
  - expected: 決め手になる
    patterns:
      - 効く
      - 効いた
    prh: 「効く」は使わない

  # 採否や判断を比喩で書かない。
  # このPRで「乗りそう？は意味不明」「傾く？？？」と指摘された言い回し。
  - expected: 採用する
    pattern: /(に|へ)(素直に)?乗(る|り|れ)そう/
    prh: 採否は比喩ではなく「採用する」「見送る」と書く

  - expected: 決める
    pattern: /(に|へ)傾(く|き|いた|いています|きました)/
    prh: 判断は比喩ではなく「決める」と書く

  # 生成AIが多用しがちな言い回し。抽象的なので具体的な言葉に置き換える。
  - expected: 詳しく調べる
    patterns:
      - 深掘り
      - 深堀り
    prh: 具体的に何をするのかを書く

  - expected: 具体的
    patterns:
      - 解像度が高い
      - 解像度を上げる
    prh: 具体的に何が分かるのかを書く

  - expected: 合わせる
    patterns:
      - 寄り添う
    prh: 何をするのかを具体的に書く

