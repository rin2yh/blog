# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
rssFullContent = true
# トップページや一覧ページの og:description に使う既定の説明文。
# 記事ページは各記事の description / 本文サマリが優先される。
description = "エンジニアのりんりんが、技術やイベント参加の記録を綴るブログです。"
googleAnalytics = "G-M2XSPTPQFB"
# Icon shown on the article share buttons (sidebar widget + mobile floating action).
# References assets/icons/brand-twitter.svg (the X logo already bundled for the social link).
shareIcon = "brand-twitter"
# OGP画像にサイト名（.Site.Title = りんりんのメモ帳）を描画する。
# テーマ 0.5.0 の新機能。siteNameSince 以降の日付の記事だけに描画され、
# それより前／日付なしの記事は既存の生成画像のまま変わらない。
[ogp]
siteName = true
siteNameSince = "2026-07-14"
[footer]
since = 2026
customText = ""

[dateFormat]
published = "2006/01/02"
lastUpdated = "2006/01/02 15:04 JST"

[sidebar.avatar]
enabled = true
local = true
src = "image/avatar.webp"

## Widgets
[[widgets.homepage]]
type = "search"
[[widgets.homepage]]
type = 'archives'
[[widgets.homepage]]
type = 'categories'
[widgets.params]
limit = 10
[[widgets.homepage]]
type = "tag-cloud"
[widgets.homepage.params]
limit = 10
[[widgets.page]]
type = "twitter-share"
[[widgets.page]]
type = "toc"

[opengraph.twitter]
site = "rin2yh"
card = "summary_large_image"

# og:image を持たないページ（トップ・カテゴリ／タグ一覧・アーカイブなど）の
# 既定 OGP 画像。以前は assets 配下の "image/avatar.webp" を指していたが、この
# パスは Hugo Pipes でフィンガープリント付きに変換され実体は /image/avatar.webp に
# 公開されないため、共有時にサムネイルが 404 になっていた。static/ogp/home.png
# （テーマの base.png にアバターを円形で載せた 1200x630 のカード）に差し替える。
# 正方形アバターをそのまま使うと summary_large_image（1.91:1）で上下が切れるため、
# 横長カードに合成している。テーマの opengraph.html は defaultImage に local を
# 見ず絶対URL化するだけなので、static 配信の実在パスを指す必要がある。
[defaultImage.opengraph]
enabled = true
src = "ogp/home.png"
