# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
rssFullContent = true
# トップページや一覧ページの og:description に使う既定の説明文。
# 記事ページは各記事の description / 本文サマリが優先される。
description = "技術やイベント参加の記録を綴るブログです。"
googleAnalytics = "G-M2XSPTPQFB"
# Icon shown on the article share buttons (sidebar widget + mobile floating action).
# References assets/icons/brand-twitter.svg (the X logo already bundled for the social link).
shareIcon = "brand-twitter"
# OGP画像にサイト名（.Site.Title = りんりんのメモ帳）を描画する。
# テーマ 0.5.0 の新機能。siteNameSince 以降の日付の記事だけに描画され、
# それより前／日付なしの記事は既存の生成画像のまま変わらない。
[ogp]
siteName = true
siteNameSince = "2026-07-14"
[footer]
since = 2026
customText = ""

[dateFormat]
published = "2006/01/02"
lastUpdated = "2006/01/02 15:04 JST"

[sidebar.avatar]
enabled = true
local = true
src = "image/avatar.webp"

## Widgets
[[widgets.homepage]]
type = "search"
[[widgets.homepage]]
type = 'archives'
[[widgets.homepage]]
type = 'categories'
[widgets.params]
limit = 10
[[widgets.homepage]]
type = "tag-cloud"
[widgets.homepage.params]
limit = 10
[[widgets.page]]
type = "twitter-share"
[[widgets.page]]
type = "toc"

[opengraph.twitter]
site = "rin2yh"
card = "summary_large_image"

# og:image を持たないページ（トップ・カテゴリ／タグ一覧・アーカイブなど）の
# 既定 OGP 画像。以前は "image/avatar.webp" を指していたが、assets 配下は Hugo Pipes
# でフィンガープリント付きに変換され /image/avatar.webp では公開されないため、共有時に
# サムネイルが 404 になっていた（テーマの opengraph.html は src を絶対URL化するだけ）。
# static 配信の実在パス static/ogp/home.jpg（base.png にアバターを円形で載せた
# 1200x630 の横長カード）に差し替える。カードは base.png + avatar.webp から生成した
# 静的ファイルなので、どちらかを更新したら作り直すこと。
# 注意: JPEG は必ず baseline（ベースライン）で書き出すこと。progressive JPEG だと
# X（Twitter）のカード画像パイプラインが描画に失敗し、Xでだけカードが出なくなる
# （Facebook / LINE / Slack 等は progressive でも表示される）。Go 標準の image/jpeg は
# 常に baseline を出力するので、それで再エンコードすれば安全。
[defaultImage.opengraph]
enabled = true
src = "ogp/home.jpg"
