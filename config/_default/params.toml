# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
rssFullContent = true
# favicon = "/favicon.png"

[footer]
since = 2026
customText = ""

[dateFormat]
published = "2006/01/02"
lastUpdated = "2006/01/02 15:04 JST"

[sidebar.avatar]
enabled = true
local = true
src = "image/avatar.webp"

## Widgets
[[widgets.homepage]]
type = "search"
[[widgets.homepage]]
type = 'archives'
[[widgets.homepage]]
type = 'categories'
[widgets.params]
limit = 10
[[widgets.homepage]]
type = "tag-cloud"
[widgets.homepage.params]
limit = 10
[[widgets.page]]
type = "toc"

[opengraph.twitter]
site = "rin2yh"
card = "summary_large_image"

[defaultImage.opengraph]
enabled = true
src = "image/avatar.webp"

## Google Analytics
[services]
[services.googleAnalytics]
id = 'G-M2XSPTPQFB'
[privacy]
[privacy.googleAnalytics]
disable = false
respectDoNotTrack = true