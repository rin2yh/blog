name: Build Hugo site
description: Install the Hugo toolchain and build the site

inputs:
  base-url:
    description: Optional base URL passed to hugo --baseURL (trailing slash is appended)
    required: false
    default: ''
  build-drafts:
    description: When 'true', build draft and future-dated content (adds --buildDrafts --buildFuture)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Create directory for user-specific executable files
      shell: bash
      run: mkdir -p "${HOME}/.local"

    - name: Install Dart Sass
      shell: bash
      env:
        DART_SASS_VERSION: 1.97.1
      run: |
        curl -sLJO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
        tar -C "${HOME}/.local" -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
        rm "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
        echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

    - name: Install Hugo
      shell: bash
      env:
        HUGO_VERSION: 0.154.2
      run: |
        curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
        mkdir "${HOME}/.local/hugo"
        tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
        rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
        echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

    - name: Verify installations
      shell: bash
      run: |
        echo "Dart Sass: $(sass --version)"
        echo "Hugo: $(hugo version)"

    - name: Configure Git
      shell: bash
      run: git config core.quotepath false

    - name: Cache restore
      id: cache-restore
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/hugo_cache
        key: hugo-${{ github.run_id }}
        restore-keys:
          hugo-

    - name: Build the site
      shell: bash
      env:
        BASE_URL: ${{ inputs.base-url }}
        BUILD_DRAFTS: ${{ inputs.build-drafts }}
        CACHE_DIR: ${{ runner.temp }}/hugo_cache
      run: |
        args=(--gc --minify --cacheDir "${CACHE_DIR}")
        if [[ -n "${BASE_URL}" ]]; then
          args+=(--baseURL "${BASE_URL}/")
        fi
        if [[ "${BUILD_DRAFTS}" == "true" ]]; then
          args+=(--buildDrafts --buildFuture)
        fi
        hugo "${args[@]}"

    - name: Cache save
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/hugo_cache
        key: ${{ steps.cache-restore.outputs.cache-primary-key }}
