name: Build Hugo site
description: Install the Hugo toolchain and build the site

inputs:
  base-url:
    description: Optional base URL passed to hugo --baseURL (trailing slash is appended)
    required: false
    default: ''
  environment:
    description: Hugo configuration environment
    required: false
    default: production
  build-drafts:
    description: When 'true', build draft and future-dated content (adds --buildDrafts --buildFuture)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Create directory for user-specific executable files
      shell: bash
      run: mkdir -p "${HOME}/.local"

    - name: Install Dart Sass
      shell: bash
      env:
        DART_SASS_VERSION: 1.97.1
      run: |
        curl -sLJO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
        tar -C "${HOME}/.local" -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
        rm "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
        echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

    - name: Install Hugo
      uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
      with:
        hugo-version: '0.168.0'
        extended: true

    - name: Verify installations
      shell: bash
      run: |
        echo "Dart Sass: $(sass --version)"
        echo "Hugo: $(hugo version)"

    - name: Configure Git
      shell: bash
      run: git config core.quotepath false

    - name: Cache restore
      id: cache-restore
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ runner.temp }}/hugo_cache
        key: hugo-${{ github.run_id }}
        restore-keys:
          hugo-

    - name: Build the site
      shell: bash
      env:
        BASE_URL: ${{ inputs.base-url }}
        HUGO_ENVIRONMENT: ${{ inputs.environment }}
        BUILD_DRAFTS: ${{ inputs.build-drafts }}
        CACHE_DIR: ${{ runner.temp }}/hugo_cache
      run: |
        args=(--environment "${HUGO_ENVIRONMENT}" --gc --minify --cacheDir "${CACHE_DIR}")
        if [[ -n "${BASE_URL}" ]]; then
          args+=(--baseURL "${BASE_URL}/")
        fi
        if [[ "${BUILD_DRAFTS}" == "true" ]]; then
          args+=(--buildDrafts --buildFuture)
        fi
        hugo "${args[@]}"

    - name: Cache save
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ runner.temp }}/hugo_cache
        key: ${{ steps.cache-restore.outputs.cache-primary-key }}
