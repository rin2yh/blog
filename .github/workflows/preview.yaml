name: Article preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'content/post/**'

permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TZ: Asia/Tokyo
  PR: ${{ github.event.pull_request.number }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      urls: ${{ steps.urls.outputs.urls }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Compute changed article URLs
        id: urls
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash .github/preview/changed-urls.sh \
            | jq -Rsc 'split("\n") | map(select(length > 0))' \
            | sed 's/^/urls=/' >> "${GITHUB_OUTPUT}"

  preview:
    needs: prepare
    if: needs.prepare.outputs.urls != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        url: ${{ fromJSON(needs.prepare.outputs.urls) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build site (with drafts)
        uses: ./.github/actions/build
        with:
          base-url: http://localhost:1313
          build-drafts: 'true'

      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22

      - name: Install Playwright Chromium
        working-directory: .github/preview
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' # postinstall で全ブラウザを落とさない
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Screenshot article
        id: shoot
        env:
          URL: ${{ matrix.url }}
          PORT: '1313'
          PUBLIC_DIR: public
          OUT_DIR: ${{ runner.temp }}/shots
        run: node .github/preview/shoot.mjs

      - name: Upload Desktop screenshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.shoot.outputs.desktop }}
          archive: false
          if-no-files-found: error

      - name: Upload Mobile screenshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.shoot.outputs.mobile }}
          archive: false
          if-no-files-found: error

  comment:
    needs: [prepare, preview]
    if: needs.prepare.outputs.urls != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Collect Artifact URLs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_URLS_FILE: ${{ runner.temp }}/artifact-urls.json
        run: |
          gh api --paginate "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            | jq -s --arg repository "${REPOSITORY}" --arg run_id "${RUN_ID}" '
                [.[].artifacts[]
                  | select(.expired == false)
                  | {
                      key: .name,
                      value: ("https://github.com/" + $repository + "/actions/runs/" + $run_id + "/artifacts/" + (.id | tostring))
                    }
                ]
                | from_entries
              ' > "${ARTIFACT_URLS_FILE}"

      - name: Build comment
        env:
          URLS_JSON: ${{ needs.prepare.outputs.urls }}
          COMMENT_FILE: ${{ runner.temp }}/comment.md
          ARTIFACT_URLS_FILE: ${{ runner.temp }}/artifact-urls.json
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # shellcheck disable=SC2016
          {
            echo '<!-- article-preview -->'
            echo "## 📝 記事プレビュー (PR #${PR})"
            echo

            urls="$(jq -r '.[]' <<< "${URLS_JSON}")"
            echo '| 記事 | Desktop | Mobile |'
            echo '| --- | --- | --- |'
            while IFS= read -r url; do
              slug="${url%/}"
              slug="${slug##*/}"
              desktop_url="$(jq -er --arg key "desktop--${slug}.png" '.[$key]' "${ARTIFACT_URLS_FILE}")"
              mobile_url="$(jq -er --arg key "mobile--${slug}.png" '.[$key]' "${ARTIFACT_URLS_FILE}")"
              printf '| `%s` | [開く](%s) | [開く](%s) |\n' "${url}" "${desktop_url}" "${mobile_url}"
            done <<< "${urls}"

            echo
            echo "<sub>下書き・未来日付の記事も含めてビルドしています。コミット \`${HEAD_SHA:0:7}\` 時点のプレビューです。</sub>"
          } > "${COMMENT_FILE}"

      - name: Post/update sticky comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: article-preview
          path: ${{ runner.temp }}/comment.md
