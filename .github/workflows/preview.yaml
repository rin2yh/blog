name: Article preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'content/post/**'

permissions:
  actions: read # Artifact URL の取得
  contents: read
  pull-requests: write # スティッキーコメント

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TZ: Asia/Tokyo
  PR: ${{ github.event.pull_request.number }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.urls.outputs.urls }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Compute changed article URLs
        id: urls
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # 空配列では matrix job を作れないため、変更なしの場合は空 URL を1つ入れる。
          bash .github/preview/changed-urls.sh \
            | jq -Rsc 'split("\n") | map(select(length > 0)) | if length == 0 then [""] else . end' \
            | sed 's/^/urls=/' >> "${GITHUB_OUTPUT}"

  preview:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        url: ${{ fromJSON(needs.prepare.outputs.urls) }}
    steps:
      - name: Checkout
        if: matrix.url != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Build site (with drafts)
        if: matrix.url != ''
        uses: ./.github/actions/build
        with:
          base-url: http://localhost:1313
          build-drafts: 'true'

      - name: Setup Node
        if: matrix.url != ''
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22

      - name: Install Playwright Chromium
        if: matrix.url != ''
        working-directory: .github/preview
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' # postinstall で全ブラウザを落とさない
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Screenshot article
        if: matrix.url != ''
        id: shoot
        env:
          URLS: ${{ matrix.url }}
          PORT: '1313'
          PUBLIC_DIR: public
          OUT_DIR: ${{ runner.temp }}/shots
        run: node .github/preview/shoot.mjs

      - name: Upload Desktop screenshot
        if: steps.shoot.outputs.desktop != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          path: ${{ steps.shoot.outputs.desktop }}
          archive: false
          if-no-files-found: error

      - name: Upload Mobile screenshot
        if: steps.shoot.outputs.mobile != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          path: ${{ steps.shoot.outputs.mobile }}
          archive: false
          if-no-files-found: error

  comment:
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, preview]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout comment script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/preview/shoot.mjs
          sparse-checkout-cone-mode: false

      - name: Collect Artifact URLs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_URLS_FILE: ${{ runner.temp }}/artifact-urls.json
        run: |
          gh api --paginate "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            | jq -s --arg repository "${REPOSITORY}" --arg run_id "${RUN_ID}" '
                [.[].artifacts[]
                  | select(.expired == false)
                  | {
                      key: .name,
                      value: ("https://github.com/" + $repository + "/actions/runs/" + $run_id + "/artifacts/" + (.id | tostring))
                    }
                ]
                | from_entries
              ' > "${ARTIFACT_URLS_FILE}"

      - name: Build comment
        env:
          URLS_JSON: ${{ needs.prepare.outputs.urls }}
          COMMENT_FILE: ${{ runner.temp }}/comment.md
          ARTIFACT_URLS_FILE: ${{ runner.temp }}/artifact-urls.json
          SHA7: ${{ github.event.pull_request.head.sha }}
        run: node .github/preview/shoot.mjs

      - name: Post/update sticky comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: article-preview
          path: ${{ runner.temp }}/comment.md
