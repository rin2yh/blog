name: Lint
on:
  pull_request:
    paths:
      - 'content/**/*.md'
      - '.textlintrc.json'
      - 'mise.toml'
      - '.github/workflows/textlint.yaml'

jobs:
  textlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Collect added Markdown files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # 新規追加された記事(A)のみを対象にする。
          # 既存記事の編集(M)は、フロントマターのタグ修正などでも
          # 本文全体が検査されてしまうため対象外とする。
          files=$(git diff --name-only --diff-filter=A "${BASE_SHA}" "${HEAD_SHA}" -- 'content/**/*.md' | tr '\n' ' ')
          echo "files=${files}" >> "${GITHUB_OUTPUT}"
          echo "Added Markdown: ${files:-<none>}"

      - name: Setup mise
        if: steps.changed.outputs.files != ''
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: true

      - name: Run textlint
        if: steps.changed.outputs.files != ''
        run: mise run lint -- ${{ steps.changed.outputs.files }}
