name: Lint
on:
  pull_request:
    paths:
      - 'content/**/*.md'
      - '.textlintrc.json'
      - 'prh.yml'
      - 'prh-strict.yml'
      - '.textlintignore'
      - 'mise.toml'
      - '.github/workflows/textlint.yaml'

jobs:
  textlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: true

      # content/**/*.md を glob 検査する。除外は .textlintignore に集約。
      - name: Run textlint
        run: mise run lint
