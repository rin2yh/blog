name: Lint
on:
  pull_request:
    paths:
      - 'content/**/*.md'
      - '.textlintrc.json'
      - 'prh-ai.yml'
      - 'prh-style.yml'
      - '.textlintignore'
      - 'mise.toml'
      - 'package.json'
      - '.npmrc'
      - '.github/workflows/textlint.yaml'

permissions: {}

jobs:
  textlint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: true

      # content/**/*.md を glob 検査する。除外は .textlintignore に集約。
      - name: Run textlint
        run: mise run lint
