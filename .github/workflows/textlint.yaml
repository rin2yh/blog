name: Lint
on:
  pull_request:
    paths:
      - 'content/**/*.md'
      - '.textlintrc.json'
      - 'prh-ai.yml'
      - 'prh-style.yml'
      - '.textlintignore'
      - 'mise.toml'
      - 'package.json'
      - '.npmrc'
      - '.github/workflows/textlint.yaml'

permissions: {}

jobs:
  textlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: true

      # content/**/*.md を glob 検査する。除外は .textlintignore に集約。
      - name: Run textlint
        run: mise run lint
