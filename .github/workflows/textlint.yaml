name: Lint
on:
  pull_request:
    paths:
      - 'content/**/*.md'
      - '.textlintrc.json'
      - 'prh-ai.yml'
      - 'prh-style.yml'
      - '.textlintignore'
      - 'mise.toml'
      - 'package.json'
      - '.npmrc'
      - '.github/workflows/textlint.yaml'

permissions: {}

jobs:
  textlint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: true

      # content/**/*.md を glob 検査する。除外は .textlintignore に集約。
      - name: Run textlint
        run: mise run lint
