name: Temporary workflow lint

on: pull_request

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.0
          install_args: actionlint ghalint zizmor

      - name: actionlint
        run: actionlint

      - name: ghalint
        if: always()
        run: ghalint run

      - name: zizmor
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .github/workflows
