baseURL = 'https://example.com/'
languageCode = 'en'
title = 'Liquid Glass'
theme = 'stack-liquid-glass'

# Set hasCJKLanguage to true if your default content language is Chinese, Japanese, or Korean.
hasCJKLanguage = false

[outputs]
home = ["HTML", "RSS", "JSON"]

[permalinks]
post = '/post/:contentbasename/'

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    ordered = true
    startLevel = 2
    endLevel = 4
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    tabWidth = 2

[related]
  includeNewer = true
  threshold = 60
  toLower = false
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 200

# ──────────────────────────────
#  Menus
# ──────────────────────────────
[[menu.main]]
  identifier = 'home'
  name = 'Home'
  weight = 1
  url = '/'
  [menu.main.params]
    icon = 'home'

[[menu.social]]
  identifier = 'rss'
  name = 'RSS'
  url = '/index.xml'
  weight = 1
  [menu.social.params]
    icon = 'rss'

[[menu.social]]
  identifier = 'github'
  name = 'GitHub'
  url = 'https://github.com/'
  weight = 2
  [menu.social.params]
    icon = 'brand-github'

# ──────────────────────────────
#  Theme Params
# ──────────────────────────────
[params]
description = "A glassmorphism Hugo theme with drifting color blobs and a calm reading layout."
mainSections = ["post"]
rssFullContent = true

  [params.footer]
  since = 2026
  customText = ""

  [params.dateFormat]
  published = "2006/01/02"
  lastUpdated = "2006/01/02 15:04 MST"

  [params.sidebar]
    [params.sidebar.avatar]
    enabled = true
    local = true
    src = "image/avatar.svg"

  [params.opengraph]
    [params.opengraph.twitter]
    site = ""
    card = "summary_large_image"

  [params.defaultImage]
    [params.defaultImage.opengraph]
    enabled = false

  # Sidebar widgets — homepage / list / taxonomy
  [[params.widgets.homepage]]
  type = "search"
  [[params.widgets.homepage]]
  type = "archives"
    [params.widgets.homepage.params]
    limit = 10
  [[params.widgets.homepage]]
  type = "categories"
    [params.widgets.homepage.params]
    limit = 10
  [[params.widgets.homepage]]
  type = "tag-cloud"
    [params.widgets.homepage.params]
    limit = 10

  # Sidebar widgets — single pages
  [[params.widgets.page]]
  type = "toc"
