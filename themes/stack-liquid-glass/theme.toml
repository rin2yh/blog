name = "Stack Liquid Glass"
license = "MIT"
licenselink = "https://github.com/rin2yh/blog/blob/main/themes/stack-liquid-glass/LICENSE"
description = "Glassmorphism / Liquid Glass theme for Hugo. Stack-inspired layout with backdrop-filter, drifting color blobs, and zero JS dependencies. Light/dark mode with localStorage persistence."
homepage = "https://github.com/rin2yh/blog"
demosite = "https://rin2yh.github.io/blog/"
tags = [
  "blog",
  "glassmorphism",
  "liquid-glass",
  "dark-mode",
  "minimal",
  "responsive",
  "japanese",
  "i18n",
]
features = [
  "dark-mode",
  "responsive",
  "search",
  "toc",
  "mermaid",
  "syntax-highlighting",
  "external-url",
  "related-posts",
  "i18n",
  "rss",
  "open-graph",
  "twitter-card",
]
min_version = "0.146.0"

[author]
name = "rin2yh"
homepage = "https://github.com/rin2yh"
