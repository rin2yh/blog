<button class="theme-toggle" data-theme-toggle type="button" aria-label="{{ T "toggleDarkMode" }}">
  <span class="theme-toggle__switch" aria-hidden="true">
    <span class="theme-toggle__thumb"></span>
  </span>
  <span class="theme-toggle__label">{{ T "darkMode" | default "ダークモード" }}</span>
</button>
