{{- $searchURL := "/page/search/" | relLangURL -}}
{{- with site.GetPage "/page/search" -}}
  {{- $searchURL = .RelPermalink -}}
{{- end -}}
<aside class="glass widget widget--search">
  <h3 class="widget__title">
    {{ partial "helper/icon" "search" }}
    <span>{{ T "search" | default "検索" }}</span>
  </h3>
  <form class="search-input-wrap" action="{{ $searchURL }}" method="get" role="search">
    <span class="search-input-icon">{{ partial "helper/icon" "search" }}</span>
    <input class="search-input" type="search" name="q" placeholder="{{ T "searchPlaceholder" | default "キーワードを入力" }}" aria-label="{{ T "search" | default "検索" }}">
  </form>
</aside>
