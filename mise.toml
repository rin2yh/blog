[tools]
go = "1.25.6"
hugo = "latest"
node = "22"

[tasks.setup]
description = 'Hugoをインストールする'
run = 'CGO_ENABLED=1 go install -tags extended github.com/gohugoio/hugo@latest'

[tasks.post]
description = 'タイトル-ランダムslugで新しい記事を作成する'
run = 'go run ./cmd/post {{ arg(i=0) }}'

[tasks.external]
description = '外部記事用のテンプレートで新しい記事を作成する'
run = 'go run ./cmd/post {{ arg(i=0) }} external'

[tasks.conf]
description = 'カンファレンスレポート用のテンプレートで新しい記事を作成する'
run = 'go run ./cmd/post {{ arg(i=0) }} conference'

[tasks.slidesync]
description = 'slidesリポジトリのデッキから未掲載の登壇記事を生成する（手元確認用。CIはsync-slidesで走る）'
run = 'go run ./cmd/slidesync {{ arg(i=0) }}'

[tasks.serve]
description = 'Hugoでサーバを起動する'
run = 'hugo server'

[env]
TEXTLINT_PKGS = '-p textlint@14.4.2 -p textlint-rule-preset-ja-technical-writing@12.0.2 -p textlint-rule-preset-ja-spacing@2.4.3 -p textlint-filter-rule-comments@1.2.2 -p textlint-filter-rule-allowlist@4.0.0 -p textlint-rule-prh@6.1.0'

[tasks.lint]
description = 'textlintで記事を検査する（過去記事は.textlintignoreで除外）'
run = 'npx --yes $TEXTLINT_PKGS -- textlint {{arg(name="files", var=true, default="content/**/*.md")}}'

[tasks."lint:fix"]
description = 'textlintで自動修正可能な問題を修正する'
run = 'npx --yes $TEXTLINT_PKGS -- textlint --fix {{arg(name="files", var=true, default="content/**/*.md")}}'
