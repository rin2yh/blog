[tools]
go = "1.25.6"
hugo = "latest"
node = "22"

[tasks.setup]
description = 'Hugoをインストールする'
run = 'CGO_ENABLED=1 go install -tags extended github.com/gohugoio/hugo@latest'

[tasks.post]
description = 'タイトル-ランダムslugで新しい記事を作成する'
run = 'go run ./cmd/post {{ arg(i=0) }}'

[tasks.external]
description = '外部記事用のテンプレートで新しい記事を作成する'
run = 'go run ./cmd/post {{ arg(i=0) }} external'

[tasks.conf]
description = 'カンファレンスレポート用のテンプレートで新しい記事を作成する'
run = 'go run ./cmd/post {{ arg(i=0) }} conference'

[tasks.serve]
description = 'Hugoでサーバを起動する'
run = 'hugo server'

[env]
TEXTLINT_PKGS = '-p textlint@14.4.2 -p textlint-rule-preset-ja-technical-writing@12.0.2 -p textlint-rule-preset-ja-spacing@2.4.3 -p textlint-filter-rule-comments@1.2.2 -p textlint-rule-prh@6.1.0'

[tasks.lint]
description = 'textlintで記事を検査する（過去記事は検出のみでCIを落とさない）'
run = '''
set -eu
legacy=$(grep -v '^#' .textlint-legacy.txt | grep -v '^$')
all=$(git ls-files 'content/**/*.md' 'content/*.md')
current=$(printf '%s\n' "$all" | grep -vxF "$legacy" || true)

# 過去記事は直さない方針なので、検出だけして終了コードは無視する
printf '%s\n' "$legacy" | xargs npx --yes $TEXTLINT_PKGS -- textlint || true

# 今後書く記事はエラーとして扱う
if [ -n "$current" ]; then
  printf '%s\n' "$current" | xargs npx --yes $TEXTLINT_PKGS -- textlint
fi
'''

[tasks."lint:fix"]
description = 'textlintで自動修正可能な問題を修正する（過去記事は対象外）'
run = '''
set -eu
legacy=$(grep -v '^#' .textlint-legacy.txt | grep -v '^$')
all=$(git ls-files 'content/**/*.md' 'content/*.md')
current=$(printf '%s\n' "$all" | grep -vxF "$legacy" || true)

if [ -n "$current" ]; then
  printf '%s\n' "$current" | xargs npx --yes $TEXTLINT_PKGS -- textlint --fix
fi
'''
